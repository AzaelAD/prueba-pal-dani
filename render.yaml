services:
  - type: web
    name: curamed-pos
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build:client && cd server && npx prisma generate
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: curamed-postgres
          property: connectionString

databases:
  - name: curamed-postgres
    plan: free
    databaseName: curamed_db
    user: curamed_admin
